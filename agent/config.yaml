# Hermes Agent configuration for Token Factory.
# Docs: https://github.com/NVIDIA/hermes-agent

provider:
  type: openai_compatible
  base_url: ${NEBIUS_BASE_URL}
  api_key: ${NEBIUS_API_KEY}
  model: nvidia/nemotron-3-super-120b-a12b

# Memory: deadlines live in SQLite (copilot/memory.py). Hermes built-in memory is wired in Stage 3.

gateway:
  slack:
    bot_token: ${SLACK_BOT_TOKEN}
    channel_id: ${SLACK_CHANNEL_ID}

skills:
  - skills/daily-plan
  - skills/lecture-notebook
